[project]
name = "exercises"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]

select = ["ALL"]

ignore = [
  "T201",   # Allow print statements
  "CPY001", # Allow missing copyright notice
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
